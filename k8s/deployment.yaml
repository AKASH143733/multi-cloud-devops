apiVersion: apps/v1
kind: Deployment
metadata:
  name: multicloud-devops-deployment
  namespace: default
  labels:
    app: multicloud-devops-app
    tier: frontend-backend
    environment: production
spec:
  # Two replicas for High Availability as required
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: multicloud-devops-app
  template:
    metadata:
      labels:
        app: multicloud-devops-app
    spec:
      restartPolicy: Always
      containers:
        - name: multicloud-container
          image: multicloud/devops-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: HOST
              value: "0.0.0.0"
            - name: DEMO_MODE
              value: "true"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: multicloud-config
                  key: AWS_REGION
            - name: AZURE_REGION
              valueFrom:
                configMapKeyRef:
                  name: multicloud-config
                  key: AZURE_REGION
            - name: GCP_REGION
              valueFrom:
                configMapKeyRef:
                  name: multicloud-config
                  key: GCP_REGION
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Liveness and Readiness health checks
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
