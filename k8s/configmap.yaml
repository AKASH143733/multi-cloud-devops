apiVersion: v1
kind: ConfigMap
metadata:
  name: multicloud-config
  namespace: default
data:
  ENVIRONMENT: "Production"
  AWS_REGION: "us-east-1"
  AZURE_REGION: "eastus"
  GCP_REGION: "us-central1"
  DEMO_MODE: "true"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: multicloud-devops-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: multicloud-devops-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
