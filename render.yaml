services:
  - type: web
    name: multicloud-devops-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: true
      - key: SECRET_KEY
        generateValue: true
