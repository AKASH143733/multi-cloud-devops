global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'multicloud-devops-platform'
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['multicloud-app:5000', 'host.docker.internal:5000', 'localhost:5000']
        labels:
          environment: 'production'
          platform: 'multicloud-devops'
