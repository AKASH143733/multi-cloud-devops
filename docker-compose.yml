version: '3.8'

services:
  # 1. Multi-Cloud DevOps Management Dashboard
  multicloud-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multicloud-devops-platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DEMO_MODE=true
      - SECRET_KEY=multicloud-devops-secret-key-2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - devops-network

  # 2. Prometheus Telemetry Scraper
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: multicloud-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - multicloud-app
    networks:
      - devops-network

  # 3. Grafana Monitoring Dashboard
  grafana:
    image: grafana/grafana:10.3.3
    container_name: multicloud-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
